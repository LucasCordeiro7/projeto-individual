<body>

<div class="janela">
  
    <div class="header-left">
        <img href="../index.html" src="../img/logoARCD.png" alt="">

        <div class="btn-nav-white">
            <a href="./dashboard.html" class="botao-dashboard">
                <i class="fa-solid fa-person-chalkboard"></i>
            </a>
        </div>

        <div class="btn-nav-white">
            <a href="./interessados.html" class="botao-dashboard">
                <i class="fa-solid fa-chart-pie"></i>
            </a>
        </div>


        <div class="btn-logout" onclick="limparSessao()">
            <h3>Sair</h3>
        </div>
    </div>

<main>

      <div class="hello">
            <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
        </div>

  <p class="titulo-secao">Visão Geral</p>
  <div class="resumo">
    <div class="cartao">
      <div class="numero" id="totalAtletas">0</div>
      <div class="label">Total de Atletas</div>
    </div>
    <div class="cartao">
      <div class="numero" id="mediaIdade">—</div>
      <div class="label">Média de Idade</div>
    </div>
    <div class="cartao">
      <div class="numero" id="totalTranstorno">0</div>
      <div class="label">Com Transtorno</div>
    </div>
  </div>

  <p class="titulo-secao">Distribuição</p>
  <div class="graficos">
    <div class="caixa-grafico">
      <h3>Por Faixa</h3>
      <canvas id="graficoFaixa"></canvas>
    </div>
    <div class="caixa-grafico">
      <h3>Por Faixa Etária</h3>
      <canvas id="graficoIdade"></canvas>
    </div>
  </div>

<div class="adicionar-atleta">
<button onclick="abrirFormulario()">Adicionar Atleta</button>
</div>

<div id="overlay" class="overlay" onclick="fecharFormulario()"></div>

<div id="meuFormulario" class="formulario" style="display: none">
  <form action="">
<label for="">Nome</label>
<input type="text" id="input_nome" placeholder="Nome Completo">

<label>Data de Nascimento</label>
<input type="date" id="input_data_nasc">

<label for="">Faixa</label>
<select id="select_faixa">
<option value="">Selecione...</option>
<option value="Branca">Faixa Branca</option>
<option value="Cinza">Faixa Cinza</option>
<option value="Azul">Faixa Azul</option>
<option value="Amarela">Faixa Amarela</option>
<option value="Laranja">Faixa Laranja</option>
<option value="Verde">Faixa Verde</option>
<option value="Roxa">Faixa Roxa</option>
<option value="Marrom">Faixa Marrom</option>
<option value="Preta">Faixa Preta</option>
</select>

<label for="">Pcd/Transtorno</label>
<input type="text" id="input_pcdTranstorno" placeholder="TDAH">
<label for="">Observações</label>
<input type="text" id="input_observacao" placeholder="Ex. não pode fazer ukemi...">
</select>

<div class="formulario-botoes">
  <button type="button" onclick="fecharFormulario()">Cancelar</button>
  <button type="button" onclick="cadastrarAtleta()">Salvar</button>
</div>

  </form>
</div>

  <p class="titulo-secao">Lista de Atletas</p>
  <div class="caixa-tabela">
    <h3>Cadastro Geral</h3>
    <table>
          <th>Nome</th>
          <th>Idade</th>
          <th>Faixa</th>
          <th>PcD / Transtorno</th>
          <th>Observações</th>
      <tbody id="corpoTabela"></tbody>
    </table>
  </div>  

</main>

</div>

</body>

</html>

<script>
  function abrirFormulario(){
    meuFormulario.style.display = "inline-block";
  }

  let faixas = [
    { nome: 'Branca',  cor: '#dddddd' },
    { nome: 'Cinza',   cor: '#999999' },
    { nome: 'Azul',    cor: '#2980b9' },
    { nome: 'Amarela', cor: '#f1c40f' },
    { nome: 'Laranja', cor: '#e67e22' },
    { nome: 'Verde',   cor: '#27ae60' },
    { nome: 'Roxa',    cor: '#8e44ad' },
    { nome: 'Marrom',  cor: '#7d4f29' },
    { nome: 'Preta',   cor: '#444444' }
  ];

  let atletas = []

  let chartFaixa = null;
  let chartIdade = null;

function calcularResumo() {
  let total = atletas.length;
  let somaIdades = 0;
  let totalTranstorno = 0;
  let media;
  let i;

  for (i = 0; i < atletas.length; i++) {
    somaIdades = somaIdades + atletas[i].idade;

    if (atletas[i].transtornoPcd != ''  && atletas[i].transtornoPcd != null) {
      totalTranstorno = totalTranstorno + 1;
    }
  }

  if (total > 0) {
    media = (somaIdades / total).toFixed(1);
  } else {
    media = '—';
  }

  document.getElementById('totalAtletas').innerHTML    = total;
  document.getElementById('mediaIdade').innerHTML      = media;
  document.getElementById('totalTranstorno').innerHTML = totalTranstorno;
}

  function contarPorFaixa(nomeFaixa) {
    let total = 0;
    let i;  

    for (i = 0; i < atletas.length; i++) {
      if (atletas[i].faixa == nomeFaixa) {
        total = total + 1;
      }
    }
    return total;
  }

function calcularIdade(dataNasc) {
  var hoje = new Date();
  var nasc = new Date(dataNasc);
  var idade = hoje.getFullYear() - nasc.getFullYear();
  return idade;
}

  function mostrarGraficoFaixa() {
    let nomes = [];
    let valores = [];
    let cores = [];
    let i;

    for (i = 0; i < faixas.length; i++) {
      nomes.push(faixas[i].nome);
      valores.push(contarPorFaixa(faixas[i].nome));
      cores.push(faixas[i].cor);
    }

    if (chartFaixa != null) {
      chartFaixa.destroy();
    }

    chartFaixa = new Chart(document.getElementById('graficoFaixa'), {
      type: 'bar',
      data: {
        labels: nomes,
        datasets: [{
          label: 'Atletas',
          data: valores,
          backgroundColor: cores
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          y: { ticks: { color: '#888', stepSize: 1 }, grid: { color: '#2e2e2e' } },
          x: { ticks: { color: '#888' }, grid: { color: '#2e2e2e' } }
        }
      }
    });
  }

  function contarPorIdade(minimo, maximo) {
    var total = 0;
    var i;

    for (i = 0; i < atletas.length; i++) {
      if (atletas[i].idade >= minimo && atletas[i].idade <= maximo) {
        total = total + 1;
      }
    }

    return total;
  }

  function mostrarGraficoIdade() {
    var faixasEtarias = ['4–10', '11–14', '15–17', '18–25', '26–40', '40+'];
    var valores = [
      contarPorIdade(4, 10),
      contarPorIdade(11, 14),
      contarPorIdade(15, 17),
      contarPorIdade(18, 25),
      contarPorIdade(26, 40),
      contarPorIdade(41, 999)
    ];

    if (chartIdade != null) {
      chartIdade.destroy();
    }

    chartIdade = new Chart(document.getElementById('graficoIdade'), {
      type: 'bar',
      data: {
        labels: faixasEtarias,
        datasets: [{
          label: 'Atletas',
          data: valores,
          backgroundColor: '#c9a84c'
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          y: { ticks: { color: '#888', stepSize: 1 }, grid: { color: '#2e2e2e' } },
          x: { ticks: { color: '#888' }, grid: { color: '#2e2e2e' } }
        }
      }
    });
  }

   function montarEtiquetas(atleta) {
  if (atleta.transtornoPcd != '' && atleta.transtornoPcd != null) {
    return '<span class="etiqueta etiqueta-transtorno">' + atleta.transtornoPcd + '</span>';
  }
  return '—';
}

  function mostrarTabela() {
    let corpo = document.getElementById('corpoTabela');
    let html = '';
    let atleta;
    let i;

    for (i = 0; i < atletas.length; i++) {
      atleta = atletas[i];

      html = html + '<tr>';
      html = html + '<td>' + atleta.nome + '</td>';
      html = html + '<td>' + atleta.idade + ' anos</td>';
      html = html + '<td>' + atleta.faixa + '</td>';
      html = html + '<td>' + montarEtiquetas(atleta) + '</td>';
      html = html + '<td>' + (atleta.observacao || '—') + '</td>';
      html = html + '</tr>';
    }

    corpo.innerHTML = html;
  }

  function abrirFormulario() {
    document.getElementById('meuFormulario').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';
  }

  function fecharFormulario() {
    document.getElementById('meuFormulario').style.display = 'none';
    document.getElementById('overlay').style.display = 'none';
  }

  function cadastrarAtleta() {
    var nomeVar     = document.getElementById('input_nome').value;
    var faixaVar    = document.getElementById('select_faixa').value;
    var pcdVar      = document.getElementById('input_pcdTranstorno').value;
    var dataNasc = document.getElementById('input_data_nasc').value;
    var obsVar   = document.getElementById('input_observacao').value;
    var fkProfessor = sessionStorage.ID_USUARIO;

    if (nomeVar == '' || dataNasc=='' || faixaVar == '' ) {
      alert('Preencha todos os campos obrigatórios.');
      return;
    }

    fetch('/alunos/cadastrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nomeServer:        nomeVar,
        dataNascServer:    dataNasc,
        faixaServer:       faixaVar,
        pcdServer:         pcdVar,
        obsServer:         obsVar,
        fkProfessorServer: fkProfessor
      })
    })
    .then(function (resposta) {
      if (resposta.ok) {
        fecharFormulario();
        obterDadosGrafico();
      } else {
        alert('Erro ao cadastrar atleta.');
      }
    })
    .catch(function (erro) {
      console.error('Erro: ', erro);
    });
  }

  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

  let proximaAtualizacao;

  // O gráfico é construído com três funções:
  // 1. obterDadosGrafico -> Traz dados do Banco de Dados para montar o gráfico da primeira vez
  // 2. plotarGrafico -> Monta o gráfico com os dados trazidos e exibe em tela
  // 3. atualizarGrafico -> Atualiza o gráfico, trazendo novamente dados do Banco

  // Esta função *obterDadosGrafico* busca os últimos dados inseridos em tabela de medidas.
  // para, quando carregar o gráfico da primeira vez, já trazer com vários dados.
  // A função *obterDadosGrafico* também invoca a função *plotarGrafico*

  //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
  //     Para ajustar o "select", ajuste o comando sql em src/models

 function obterDadosGrafico() {
  var fkProfessor = sessionStorage.ID_USUARIO;

  fetch(`/alunos/${fkProfessor}`, { cache: 'no-store' }).then(function (response) {
    if (response.ok) {
      response.json().then(function (resposta) {
        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

        atletas = [];

        for (var i = 0; i < resposta.length; i++) {
         atletas.push({
                nome:          resposta[i].nome,
                idade:         calcularIdade(resposta[i].data_nascimento),
                faixa:         resposta[i].faixa,
                transtornoPcd: resposta[i].transtorno_pcd || '', 
                observacao:    resposta[i].observacao || '',
                status:        resposta[i].status || 'Ativo'
              });
        }

        plotarGrafico();
      });
    } else {
      console.error('Nenhum dado encontrado ou erro na API');
    }
  })
  .catch(function (error) {
    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
  });
}

  // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
  // Configura o gráfico (cores, tipo, etc), materializa-o na página e, 
  // A função *plotarGrafico* também invoca a função *atualizarGrafico*
  function plotarGrafico() {
    console.log('iniciando plotagem do gráfico...');

    calcularResumo();
    mostrarGraficoFaixa();
    mostrarGraficoIdade();
    mostrarTabela();
  }

  // Esta função *atualizarGrafico* atualiza o gráfico que foi renderizado na página,
  // buscando a última medida inserida em tabela contendo as capturas,

  //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
  //     Para ajustar o "select", ajuste o comando sql em src/models
  function atualizarGrafico() {
    // Atletas não precisam de atualização em tempo real.
    // A dashboard atualiza ao cadastrar um novo atleta via cadastrarAtleta()
  }

  obterDadosGrafico();


</script>
