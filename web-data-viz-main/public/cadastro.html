<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCD | Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../public/css/cadastro.css">
</head>
<body>

  <main class="container">

<section class="area-formulario">

  <h1>Crie seu cadastro</h1>
<form class="formulario">
<input id="codigo_input" class="input" type="text" placeholder="Token de Adiministrador">
<input id="nome_input" class="input" type="text" placeholder="Nome completo">
<input id="email_input" class="input" type="email" placeholder="Digite seu email...">
<input id="senha_input" class="input" type="senha" placeholder="Digite sua senha...">
<input id="confirmacao_senha_input" class="input" type="senha" placeholder="Confirme sua senha...">

</form>

<div class="alerta_erro">
  <div class="card_erro" id="cardErro">
    <span id="mensagem_erro"></span>
  </div>
</div>

<button class="botao" type="submit" onclick="cadastrar()">Cadastrar</button>

<div class="area">
  <span class="link">Já tem conta?<a class="link-cadastro" href="cadastro.html">Acesse aqui</a> </span>
</div>

 <div id="div_aguardar" class="loading-div">
  <img src="./assets/aguarde-orange.gif" id="loading-gif" />
   </div>

</section>



<section class="area-imagens">
<img src="../public/img/treinoCesao.jpg">

</main>

</body>
</html>

<script>

  // Array para armazenar os crecs cadastradas para validação de código de ativação 
  let listaCrecCadastrados = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var codigoVar = codigo_input.value;
    var idCrecVincular

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      codigoVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaCrecCadastrados.length; i++) {
      if (listaCrecCadastrados[i].codigo_ativacao == codigoVar) {
        idCrecVincular = listaCrecCadastrados[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        idCrecVincularServer: idCrecVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando os crecs cadastrados 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaCrecCadastrados.push(empresa);

            console.log("listaCrecCadastrados")
            console.log(listaCrecCadastrados[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
