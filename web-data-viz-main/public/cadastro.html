<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCD | Cadastro</title>

    <script src="./js/sessao.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/cadastro.css">
</head>
<body onload="listar()">

  <main class="container">

<section class="area-formulario">

  <h1>Crie seu cadastro</h1>
<form class="formulario">
<input id="codigo_input" class="input" type="text" placeholder="Token de Adiministrador">
<input id="nome_input" class="input" type="text" placeholder="Nome completo">
<input id="email_input" class="input" type="email" placeholder="Digite seu email...">
<input id="senha_input" class="input" type="password" placeholder="Digite sua senha...">
<input id="confirmacao_senha_input" class="input" type="password" placeholder="Confirme sua senha...">

</form>

<div class="alerta_erro">
  <div class="card_erro" id="cardErro">
    <span id="mensagem_erro"></span>
  </div>
</div>

<button class="botao" type="submit" onclick="cadastrar()">Cadastrar</button>

<div class="area">
  <span class="link">Já tem conta?<a class="link-cadastro" href="login.html">Acesse aqui</a> </span>
</div>

 <div id="div_aguardar" class="loading-div">
  <img src="./assets/aguarde-orange.gif" id="loading-gif" />
   </div>

   <div id="div_erros_login"></div>

</section>

<section class="area-imagens">
<img src="./img/treinoCesao.jpg">

</main>

</body>
</html>

<script>

  // Array para armazenar os crecs cadastradas para validação de código de ativação 
  let listaCrecCadastrados = [];

function listar() {
    fetch('/empresas/listar')
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (json) {
            listaCrecCadastrados = json;
        })
        .catch(function (erro) {
            console.log("Erro ao buscar CRECs: ", erro);
        });
}
  
  function cadastrar() {
  aguardar();

  var nomeVar             = nome_input.value;
  var emailVar            = email_input.value;
  var senhaVar            = senha_input.value;
  var confirmacaoSenhaVar = confirmacao_senha_input.value;
  var codigoVar           = codigo_input.value;
  var idCrecVincular;

  let erros = [];

  if (nomeVar == '')             erros.push('Nome é obrigatório.');
  if (emailVar == '')            erros.push('Email é obrigatório.');
  if (!emailVar.includes('@'))   erros.push('Email inválido.');
  if (senhaVar == '')            erros.push('Senha é obrigatória.');
  if (senhaVar.length < 8)       erros.push('Senha deve ter pelo menos 8 caracteres.');
  if (senhaVar != confirmacaoSenhaVar) erros.push('As senhas não coincidem.');
  if (codigoVar == '')           erros.push('Código de administrador é obrigatório.');

  let codigoValido = false;
  for (let i = 0; i < listaCrecCadastrados.length; i++) {
    if (listaCrecCadastrados[i].codigo_ativacao == codigoVar) {
      idCrecVincular = listaCrecCadastrados[i].id;
      codigoValido = true;
      break;
    }
  }
  if (codigoVar != '' && !codigoValido) erros.push('Código de administrador inválido.');

  if (erros.length > 0) {
    cardErro.style.display = 'block';

    let mensagem = '';
    for (let i = 0; i < erros.length; i++) {
      mensagem += '• ' + erros[i] + '<br>';
    }

    mensagem_erro.innerHTML = mensagem;
    finalizarAguardar();
    return false;
  }


  fetch('/usuarios/cadastrar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      nomeServer:          nomeVar,
      emailServer:         emailVar,
      senhaServer:         senhaVar,
      idCrecVincularServer: idCrecVincular
    }),
  })
  .then(function (resposta) {
    if (resposta.ok) {
      cardErro.style.display = 'block';
      mensagem_erro.innerHTML = 'Cadastro realizado com sucesso! Redirecionando...';
      setTimeout(() => { window.location = 'login.html'; }, 2000);
      limparFormulario();
      finalizarAguardar();
    } else {
      throw 'Houve um erro ao tentar realizar o cadastro!';
    }
  })
  .catch(function (resposta) {
    console.log(`#ERRO: ${resposta}`);
    finalizarAguardar();
  });

  return false;
}

</script>
