<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ARCD | Cadastro</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/cadastro.css" />
    <link rel="shortcut icon" href="./img/logoARCD.png" type="image/x-icon" />
  </head>
  <body>
    <div class="topo">
      <header>
        <div class="logo">
          <a href="./index.html">
            <img src="./img/logoARCD.png" alt="Logo ARCD" />
          </a>
        </div>
      </header>
    </div>

    <div class="pagina">
      <div class="formulario">
        <div class="cabecalho">
          <img src="./img/imgLogin.png" alt="Logo ARCD" class="logo-form" />
          <h2>Criar sua conta</h2>
          <p>Preencha os dados abaixo para se cadastrar</p>
        </div>

        <div id="cardErro">
          <span id="mensagem_erro"></span>
        </div>

        <div class="campo">
          <label for="input_nome">Nome Completo</label>
          <div class="caixa">
            <input type="text" id="input_nome" placeholder="João da Silva" />
          </div>
        </div>

        <div class="campo">
          <label for="input_email">E-mail</label>
          <div class="caixa">
            <input
              type="email"
              id="input_email"
              placeholder="seunome@email.com"
            />
          </div>
        </div>

        <div class="campo">
          <label for="input_cpf">CPF</label>
          <div class="caixa">
        
            <input
              type="text"
              id="input_cpf"
              placeholder="000.000.000-00"
              maxlength="14"
            />
          </div>
        </div>

        <div class="campo">
          <label for="input_senha">Senha</label>
          <div class="caixa">
            <input
              type="password"
              id="input_senha"
              placeholder="Mínimo 8 caracteres"
            />
            <button
              type="button"
              onclick="toggleSenha('input_senha', this)"
              tabindex="-1"
            >
              <i class="bi bi-eye-slash"></i>
            </button>
          </div>
        </div>

        <div class="campo">
          <label for="input_confirmar_senha">Confirmar Senha</label>
          <div class="caixa">
            <input
              type="password"
              id="input_confirmar_senha"
              placeholder="Repita a senha"
            />
            <button
              type="button"
              onclick="toggleSenha('input_confirmar_senha', this)"
              tabindex="-1"
            >
            </button>
          </div>
        </div>

        <button class="botao" onclick="cadastrar()">Criar Conta</button>

        <div class="rodape">
          <p>Já possui cadastro? <a href="login.html">Entrar</a></p>
        </div>
      </div>
    </div>
  </body>
  <script>
    let listaUsuarios = [];

    listar();

    function cadastrar() {
      var nomeVar = nome_input.value;
      var emailVar = email_input.value;
      var senhaVar = senha_input.value;
      var cpfVar = cpf_input.value;
      var confirmacaoSenhaVar = confirmacao_senha_input.value;

      var campos = [nomeVar, emailVar, cpfVar, senhaVar, confirmarSenhaVar];

      for (let i = 0; i < campos.length; i++) {
        if (campos[i] == "") {
          mostrarErro("Preencha todos os campos!");
          return false;
        }
      }

      let errosSenha = [];

      if (senhaVar.length < 8) {
        errosSenha.push("A senha precisa ter pelo menos 8 caracteres!");
      }

      if (senhaVar == senhaVar.toLowerCase()) {
        errosSenha.push("A senha precisa ter pelo menos uma letra maiúscula!");
      }

      if (!/[0-9]/.test(senhaVar)) {
        errosSenha.push("A senha precisa ter pelo menos um número!");
      }

      // Percorre o vetor de erros e mostra cada um
      for (let i = 0; i < errosSenha.length; i++) {
        mostrarErro(errosSenha[i]);
        podeCadastrar = false;
      }
      for (let i = 0; i < regrasSenha.length; i++) {
        if (regrasSenha[i].teste) {
          mostrarErro(regrasSenha[i].mensagem);
          return false;
        }
      }

      if (senhaVar != confirmarSenhaVar) {
        mostrarErro("As senhas não coincidem!");
        return false;
      }

       if (podeCadastrar) {
        fetch("/usuarios/cadastrar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            nomeServer:  nomeVar,
            emailServer: emailVar,
            cpfServer:   cpfSoNumeros,
            senhaServer: senhaVar,
          }),
        })
          .then(function (resposta) {
            if (resposta.ok) {
              mostrarErro("Cadastro realizado com sucesso! Redirecionando...");
              setTimeout(() => {
                window.location = "login.html";
              }, 2000);
            } else {
              throw "Houve um erro ao tentar realizar o cadastro!";
            }
          })
          .catch(function (erro) {
            console.log(`#ERRO: ${erro}`);
            mostrarErro("Houve um erro ao tentar realizar o cadastro!");
          });
      }
 
    }
 
    // Buscando os usuários cadastrados no banco de dados
    function listar() {
      fetch("/usuarios/listar", {
        method: "GET",
      })
        .then(function (resposta) {
          return resposta.json();
        })
        .then(function (usuarios) {
          for (let i = 0; i < usuarios.length; i++) {
            listaUsuarios.push(usuarios[i]);
            console.log("Usuário adicionado: ", usuarios[i]);
          }
        })
        .catch(function (erro) {
          console.log(`#ERRO: ${erro}`);
        });
    }
 
    // Mostra a mensagem de erro na tela
    function mostrarErro(mensagem) {
      document.getElementById("cardErro").style.display = "block";
      document.getElementById("mensagem_erro").innerHTML = mensagem;
      setTimeout(sumirMensagem, 5000);
    }
 
    // Esconde a mensagem de erro
    function sumirMensagem() {
      document.getElementById("cardErro").style.display = "none";
    }
 
    // Mostra/esconde a senha
    function toggleSenha(id, btn) {
      const input = document.getElementById(id);
      const icone = btn.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icone.className = "bi bi-eye";
      } else {
        input.type = "password";
        icone.className = "bi bi-eye-slash";
      }
    }
 
  </script>
</html>
