<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCD | Login</title>

  <script src="./js/sessao.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lexend&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/login.css">

</head>

<body>

  <main class="container">

    <section class="area-formulario">

      <h1>Minha conta</h1>
      <form class="formulario">
        <input class="input" type="email" id="email_input" placeholder="Digite seu email...">
        <input class="input" type="password" id="senha_input" placeholder="Digite sua senha...">
      </form>
      <button class="botao" type="submit" onclick="entrar()">Acessar</button>


      <div class="login">
        <div class="alerta_erro">
          <div class="card_erro" id="cardErro">
            <span id="mensagem_erro"></span>
          </div>
        </div>

        <div class="area">
          <span class="link">Novo por aqui? <a class="link-cadastro" href="cadastro.html">Cadastre-se</a> </span>
        </div>

         <div id="div_aguardar" class="loading-div">
                    <img src="./assets/aguarde-orange.gif" id="loading-gif">
                </div>

        <div id="div_erros_login"></div>


    </section>


    <section class="area-imagens">
      <img src="./img/Prefeitura-de-Sao-Bernardo-do-Campo-realiza-nova-seletiva-para-atletas-de-judo-1.jpg"
        alt="Seletiva de judo ARCD">
    </section>

  </main>


</body>

</html>

<script>
 function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/dashboard.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

  </script>
