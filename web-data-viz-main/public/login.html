<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARCD | Login</title>

    <script src="./js/sessao.js"></script>
    <link rel="shortcut icon" href="./img/logoARCD.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

    <!--Header-->

 <div class="background-header">

      <header>
        <div class="logo">
          <a href="./index.html">
            <img src="./img/logoARCD.png" alt="Logo ARCD" />
          </a>
        </div>

      </header>
  </div>

        <div class="container2">
      <div class="box">
        <div class="logo">
          <img src="./img/imgLogin.png" alt="" />
        </div>
        <div class="inputs">
          <h2>Acesse sua conta</h2>

          <div class="emailMaior">
            <p>Email</p>
            <div class="email">
              <i class="bi bi-envelope"></i>
              <input
                type="email"
                id="input_email"
                placeholder="seunome@email.com"
              />
            </div>
          </div>

          <div class="senhaMaior">
            <p>Senha</p>
            <div class="senha">
              <i class="bi bi-lock"></i>
              <input type="password" id="input_senha" placeholder="******" />
            </div>
          </div>
        </div>
        <button onclick="ent()">Entrar</button>
        <p>
          <a href="#">Esqueceu a senha?</a>
        </p>
        <p>
          Não possui cadastro?
          <a href="../Página de cadastro/Cadastro.html">Cadastre-se</a>
        </p>
      </div>
    </div>



  </body>
</html>
